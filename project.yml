name: PulseFloat
options:
  developmentLanguage: zh-Hant
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  PulseFloat:
    type: application
    platform: macOS
    sources: [PulseFloat]
    dependencies:
      - target: PulseFloatCore
        embed: true
      - target: PulseFloatScene
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.victorhuang.PulseFloat
    info:
      path: PulseFloat/Resources/Info.plist
      properties:
        LSUIElement: true
        NSAudioCaptureUsageDescription: "PulseFloat 需要讀取系統正在播放的聲音，才能即時畫出頻譜。聲音只在本機分析，不會錄音或上傳。"
        CFBundleDisplayName: PulseFloat
        LSApplicationCategoryType: public.app-category.music
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
  PulseFloatCore:
    type: framework
    platform: macOS
    sources: [PulseFloatCore]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.victorhuang.PulseFloatCore
  PulseFloatScene:
    type: framework
    platform: macOS
    sources: [PulseFloatScene]
    dependencies:
      - target: PulseFloatCore
      - sdk: SceneKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.victorhuang.PulseFloatScene
  PulseFloatSceneTests:
    type: bundle.unit-test
    platform: macOS
    sources: [PulseFloatSceneTests]
    dependencies:
      - target: PulseFloatScene
        embed: true
      - target: PulseFloatCore
        embed: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.victorhuang.PulseFloatSceneTests
  PulseFloatShots:
    type: tool
    platform: macOS
    sources: [Tools/PulseFloatShots]
    dependencies:
      - target: PulseFloatScene
      - target: PulseFloatCore
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: "@executable_path"
        PRODUCT_BUNDLE_IDENTIFIER: com.victorhuang.PulseFloatShots
  PulseFloatCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [PulseFloatCoreTests]
    dependencies:
      - target: PulseFloatCore
        embed: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.victorhuang.PulseFloatCoreTests
schemes:
  PulseFloat:
    build:
      targets:
        PulseFloat: all
    test:
      targets: [PulseFloatCoreTests]
  PulseFloatCore:
    build:
      targets:
        PulseFloatCore: all
    test:
      targets: [PulseFloatCoreTests]
  PulseFloatScene:
    build:
      targets:
        PulseFloatScene: all
    test:
      targets: [PulseFloatSceneTests]
  PulseFloatShots:
    build:
      targets:
        PulseFloatShots: all
