name: PulseFloat
options:
  developmentLanguage: zh-Hant
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  PulseFloat:
    type: application
    platform: macOS
    sources: [PulseFloat]
    dependencies:
      - target: PulseFloatCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.victorhuang.PulseFloat
    info:
      path: PulseFloat/Resources/Info.plist
      properties:
        LSUIElement: true
        NSAudioCaptureUsageDescription: "PulseFloat 需要讀取系統正在播放的聲音，才能即時畫出頻譜。聲音只在本機分析，不會錄音或上傳。"
        NSAppleEventsUsageDescription: "PulseFloat 只會讀取正在播放的歌曲或影片名稱與封面，顯示在圓環中央；不會控制播放，也不會上傳任何資料。"
        CFBundleDisplayName: PulseFloat
        LSApplicationCategoryType: public.app-category.music
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
  PulseFloatCore:
    type: framework
    platform: macOS
    sources: [PulseFloatCore]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.victorhuang.PulseFloatCore
  PulseFloatCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [PulseFloatCoreTests]
    dependencies:
      - target: PulseFloatCore
        embed: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.victorhuang.PulseFloatCoreTests
schemes:
  PulseFloat:
    build:
      targets:
        PulseFloat: all
    test:
      targets: [PulseFloatCoreTests]
  PulseFloatCore:
    build:
      targets:
        PulseFloatCore: all
    test:
      targets: [PulseFloatCoreTests]
